name: Deploy Admin Dashboard to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: cd admin-dashboard && npm install

      - name: Build admin
        run: cd admin-dashboard && npm run build
        env:
          VITE_API_URL: https://chatbot-api.weblyftt.workers.dev
          VITE_WIDGET_URL: https://chatbot-widget-0of.pages.dev
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy admin-dashboard/dist --project-name=chatbot-admin
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
