name: Deploy Admin Dashboard to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd admin-dashboard && npm install

      - name: Build admin
        run: cd admin-dashboard && npm run build
        # VITE_API_URL is public (the Worker URL); VITE_CLERK_PUBLISHABLE_KEY is
        # the Clerk publishable key (pk_test_...) — both must be baked in at
        # build time. The Clerk key makes the login screen render.
        env:
          VITE_API_URL: https://chatbot-api.weblyftt.workers.dev
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: chatbot-admin
          directory: admin-dashboard/dist
          branch: main